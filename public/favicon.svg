<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with brutalist border -->
  <rect x="0" y="0" width="512" height="512" fill="#FFE600" />
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#0A0A0A" stroke-width="28" />

  <!-- Barbell Bar in Background -->
  <rect x="40" y="232" width="432" height="48" fill="#0A0A0A" />
  
  <!-- Barbell Collar Ridges / Knurling -->
  <rect x="80" y="212" width="36" height="88" fill="#E63946" stroke="#0A0A0A" stroke-width="12" />
  <rect x="396" y="212" width="36" height="88" fill="#E63946" stroke="#0A0A0A" stroke-width="12" />

  <!-- Heavy Calibrated Weight Plate Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="#FFE600" stroke="#0A0A0A" stroke-width="28" />
  <circle cx="256" cy="256" r="120" fill="#0A0A0A" />
  
  <!-- Stencil 'L' Monogram in Center -->
  <path d="M 216 172 H 256 V 300 H 308 V 340 H 216 Z" fill="#FFE600" />

  <!-- Top Right 'LK' Badge -->
  <rect x="352" y="32" width="128" height="64" fill="#E63946" stroke="#0A0A0A" stroke-width="16" />
  <text x="416" y="78" font-family="'Archivo Black', 'Impact', sans-serif" font-weight="900" font-size="42" fill="#F4F1EA" text-anchor="middle">LK</text>
</svg>
